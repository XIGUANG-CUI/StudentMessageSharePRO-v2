{% extends "base.html" %}
{% block title %}保费催缴 - 学生数据管理系统{% endblock %}
{% block head %}
<style>
    .icl-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .icl-tab { border: 1px solid #dee2e6; background: #fff; color: #495057; border-radius: 999px;
               padding: 4px 14px; font-size: 0.82rem; cursor: pointer; }
    .icl-tab:hover { border-color: #0d6efd; color: #0d6efd; }
    .icl-tab.active { background: #0d6efd; border-color: #0d6efd; color: #fff; }
    .icl-tab .icl-tab-count { display: inline-block; margin-left: 4px; font-size: 0.72rem; opacity: .8; }
    .icl-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                   background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .icl-toolbar .form-control, .icl-toolbar .form-select { font-size: 0.8rem; }
    .icl-search { width: 220px; }
    .icl-table-wrap { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; overflow: auto;
                      max-height: calc(100vh - 260px); }
    .icl-table-wrap thead th { position: sticky; top: 0; background: #f1f3f5; z-index: 2; font-size: 0.78rem; white-space: nowrap; }
    .icl-table-wrap td { font-size: 0.8rem; }
    .icl-type { display: inline-block; padding: 1px 8px; border-radius: 8px; font-size: 0.72rem; }
    .icl-type-xueping { background: #f0ebff; color: #59359a; }
    .icl-type-intern { background: #e7f5ff; color: #0b7285; }
    .icl-date { width: 140px; font-size: 0.78rem; }
    .icl-toast { position: fixed; bottom: 20px; right: 20px; z-index: 9999; padding: 10px 18px;
                 border-radius: 6px; color: #fff; font-size: 0.85rem; }
    .icl-toast.success { background: #198754; }
    .icl-toast.error { background: #dc3545; }
    .modal-icl .modal-header { background: #0d6efd; color: #fff; border-radius: 5px 5px 0 0; }
    .modal-icl .modal-header .btn-close { filter: invert(1); }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0"><i class="bi bi-cash-coin me-2"></i>保费催缴</h5>
    <span class="text-muted small">此处只登记收费：参保与保单已在续保/首保环节完成，缴费仅为滞后的收款记录</span>
</div>

<div class="icl-tabs">
    <button type="button" class="icl-tab active" data-tab="pending">
        待缴费<span class="icl-tab-count" id="iclPendingCount">0</span>
    </button>
    <button type="button" class="icl-tab" data-tab="paid">
        已缴费（只读）<span class="icl-tab-count" id="iclPaidCount">0</span>
    </button>
</div>

<div class="icl-toolbar">
    <input type="text" class="form-control form-control-sm icl-search" id="iclSearch" placeholder="学号 / 姓名 / 拼音 / 身份证号">
    <select class="form-select form-select-sm" id="iclSchool" style="width:120px">
        <option value="">全部校别</option>
        {% for st in school_types %}
        <option value="{{ st.code }}">{{ st.name }}</option>
        {% endfor %}
    </select>
    <select class="form-select form-select-sm" id="iclGrade" style="width:110px">
        <option value="">全部年级</option>
        {% for g in filter_values.grades %}
        <option value="{{ g }}">{{ g }}级</option>
        {% endfor %}
    </select>
    <select class="form-select form-select-sm" id="iclClass" style="width:120px">
        <option value="">全部班级</option>
        {% for c in filter_values.classes %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
    </select>
    <select class="form-select form-select-sm" id="iclType" style="width:130px;display:none">
        <option value="">全部险种</option>
        <option value="xueping">学平险</option>
        <option value="intern">实习就业险</option>
    </select>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="iclReset">重置</button>

    <div class="ms-auto d-flex gap-2 align-items-center" id="iclPayBar">
        <span class="text-muted small">统一缴费日期</span>
        <input type="date" class="form-control form-control-sm icl-date" id="iclBatchDate">
        <button type="button" class="btn btn-sm btn-success" id="iclPayBatch">
            <i class="bi bi-check2-square me-1"></i>批量录入缴费
        </button>
        <button type="button" class="btn btn-sm btn-outline-primary" id="iclExportBtn">
            <i class="bi bi-download me-1"></i>导出待缴费名单
        </button>
    </div>
</div>

<div class="icl-table-wrap">
    <table class="table table-sm table-hover align-middle mb-0">
        <thead id="iclHead"></thead>
        <tbody id="iclBody">
            <tr><td colspan="12" class="text-center text-muted py-4">加载中…</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
    var items = [];
    var selected = {};
    var currentTab = 'pending';

    var schoolMap = {};
    {% for st in school_types %}schoolMap[{{ st.code|tojson }}] = {{ st.name|tojson }};{% endfor %}
    function schoolName(code) { return schoolMap[code] || code || ''; }

    function $(id) { return document.getElementById(id); }
    function esc(v) {
        return String(v === null || v === undefined ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function toast(message, type) {
        var div = document.createElement('div');
        div.className = 'icl-toast ' + (type || 'success');
        div.textContent = message;
        document.body.appendChild(div);
        setTimeout(function () { div.remove(); }, 2600);
    }

    function typeBadge(type) {
        if (type === 'intern') {
            return '<span class="icl-type icl-type-intern">实习就业险</span>';
        }
        return '<span class="icl-type icl-type-xueping">学平险</span>';
    }

    function queryString() {
        var map = {
            search: $('iclSearch').value.trim(),
            school: $('iclSchool').value,
            grade: $('iclGrade').value,
            admin_class: $('iclClass').value,
            insurance_type: currentTab === 'paid' ? $('iclType').value : '',
            status: currentTab
        };
        var parts = [];
        Object.keys(map).forEach(function (key) {
            if (map[key]) { parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(map[key])); }
        });
        return parts.join('&');
    }

    function render() {
        var head = $('iclHead');
        var body = $('iclBody');
        var colspan = currentTab === 'pending' ? 12 : 11;
        if (currentTab === 'pending') {
            head.innerHTML = '<tr>'
                + '<th style="width:36px"><input type="checkbox" id="iclCheckAll"></th>'
                + '<th>姓名</th><th>学号</th><th>校别</th><th>班级</th><th>年级</th><th>在校状态</th>'
                + '<th>险种</th><th>批次</th><th>状态</th><th>缴费日期</th><th style="width:80px">操作</th></tr>';
        } else {
            head.innerHTML = '<tr>'
                + '<th>姓名</th><th>学号</th><th>校别</th><th>班级</th><th>年级</th><th>在校状态</th>'
                + '<th>险种</th><th>批次</th><th>缴费日期</th><th>保单号</th><th>到期日期</th></tr>';
        }

        if (!items.length) {
            body.innerHTML = '<tr><td colspan="' + colspan + '" class="text-center text-muted py-4">暂无记录</td></tr>';
            bindCheckAll();
            return;
        }

        var html = '';
        items.forEach(function (s) {
            var checked = selected[s.record_id] ? ' checked' : '';
            var check = '<td><input type="checkbox" class="icl-row-check" data-rid="' + s.record_id + '"' + checked + '></td>';
            var base = '<td class="fw-semibold">' + esc(s.name) + '</td>'
                + '<td>' + esc(s.student_no) + '</td>'
                + '<td>' + esc(schoolName(s.school)) + '</td>'
                + '<td>' + esc(s.admin_class) + '</td>'
                + '<td>' + esc(s.grade) + '</td>'
                + '<td>' + esc(s.attendance_status) + '</td>';

            if (currentTab === 'pending') {
                html += '<tr>' + check + base
                    + '<td>' + typeBadge(s.insurance_type) + '</td>'
                    + '<td>第' + (s.batch_no || '?') + '年</td>'
                    + '<td>' + esc(s.status_label) + '</td>'
                    + '<td><input type="date" class="form-control form-control-sm icl-date icl-row-date" data-rid="' + s.record_id + '"></td>'
                    + '<td><button type="button" class="btn btn-sm btn-outline-success icl-pay-one" data-rid="' + s.record_id + '">保存</button></td>'
                    + '</tr>';
            } else {
                html += '<tr>' + base
                    + '<td>' + typeBadge(s.insurance_type) + '</td>'
                    + '<td>第' + (s.batch_no || '?') + '年</td>'
                    + '<td>' + esc(s.pay_date) + '</td>'
                    + '<td>' + esc(s.policy_no) + '</td>'
                    + '<td>' + esc(s.expiry_date) + '</td>'
                    + '</tr>';
            }
        });
        body.innerHTML = html;
        bindCheckAll();
    }

    function bindCheckAll() {
        var all = $('iclCheckAll');
        if (!all) { return; }
        all.addEventListener('change', function () {
            var checked = this.checked;
            items.forEach(function (s) {
                if (checked) { selected[s.record_id] = true; } else { delete selected[s.record_id]; }
            });
            render();
        });
    }

    function updateCounts(summary) {
        summary = summary || {};
        $('iclPendingCount').textContent = summary.pending || 0;
        $('iclPaidCount').textContent = summary.paid || 0;
    }

    function load() {
        fetch('/api/insurance/collection/list?' + queryString())
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!data.success) { toast(data.message || '加载失败', 'error'); return; }
                items = data.items || [];
                updateCounts(data.summary);
                var keep = {};
                items.forEach(function (s) { if (selected[s.record_id]) { keep[s.record_id] = true; } });
                selected = keep;
                render();
            })
            .catch(function () { toast('加载失败', 'error'); });
    }

    function postJSON(url, payload) {
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function (r) { return r.json(); });
    }

    document.querySelectorAll('.icl-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.icl-tab').forEach(function (t) { t.classList.remove('active'); });
            tab.classList.add('active');
            currentTab = tab.getAttribute('data-tab');
            selected = {};
            $('iclPayBar').classList.toggle('d-none', currentTab !== 'pending');
            $('iclType').style.display = currentTab === 'paid' ? '' : 'none';
            load();
        });
    });

    $('iclSearch').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { selected = {}; load(); }
    });
    ['iclSchool', 'iclGrade', 'iclClass', 'iclType'].forEach(function (id) {
        $(id).addEventListener('change', function () { selected = {}; load(); });
    });
    $('iclReset').addEventListener('click', function () {
        $('iclSearch').value = '';
        ['iclSchool', 'iclGrade', 'iclClass', 'iclType'].forEach(function (id) { $(id).value = ''; });
        selected = {};
        load();
    });

    $('iclBody').addEventListener('change', function (e) {
        var box = e.target.closest('.icl-row-check');
        if (!box) { return; }
        var rid = box.getAttribute('data-rid');
        if (box.checked) { selected[rid] = true; } else { delete selected[rid]; }
    });

    $('iclBody').addEventListener('click', function (e) {
        var btn = e.target.closest('.icl-pay-one');
        if (!btn) { return; }
        var rid = btn.getAttribute('data-rid');
        var input = document.querySelector('.icl-row-date[data-rid="' + rid + '"]');
        var payDate = input ? input.value : '';
        if (!payDate) { toast('请先选择缴费日期', 'error'); return; }
        postJSON('/api/insurance/collection/pay', {
            items: [{ record_id: Number(rid), pay_date: payDate }]
        }).then(function (data) {
            if (!data.success) { toast(data.message || '录入失败', 'error'); return; }
            if (!data.count) { toast('该记录状态已变更，请刷新', 'error'); return; }
            toast('已录入缴费日期', 'success');
            delete selected[rid];
            load();
        });
    });

    $('iclPayBatch').addEventListener('click', function () {
        var ids = Object.keys(selected);
        if (!ids.length) { toast('请先选择学生', 'error'); return; }
        var payDate = $('iclBatchDate').value;
        if (!payDate) { toast('请先选择统一缴费日期', 'error'); return; }
        if (!confirm('确认将选中的 ' + ids.length + ' 条记录缴费日期设为 ' + payDate + '？')) { return; }
        postJSON('/api/insurance/collection/pay', {
            record_ids: ids.map(Number),
            pay_date: payDate
        }).then(function (data) {
            if (!data.success) { toast(data.message || '录入失败', 'error'); return; }
            toast('已录入 ' + data.count + ' 条' + (data.skipped ? '，跳过 ' + data.skipped + ' 条' : ''), 'success');
            selected = {};
            load();
        });
    });

    $('iclExportBtn').addEventListener('click', function () {
        var map = {
            search: $('iclSearch').value.trim(),
            school: $('iclSchool').value,
            grade: $('iclGrade').value,
            admin_class: $('iclClass').value
        };
        var parts = [];
        Object.keys(map).forEach(function (key) {
            if (map[key]) { parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(map[key])); }
        });
        fetch('/api/insurance/collection/export?' + parts.join('&'))
            .then(function (r) {
                if (!r.ok) {
                    return r.json().then(function (d) { throw new Error(d.message || '导出失败'); });
                }
                return r.blob();
            })
            .then(function (blob) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = '待缴费名单.xlsx';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                toast('已导出待缴费名单', 'success');
            })
            .catch(function (err) { toast(err.message || '导出失败', 'error'); });
    });

    load();
})();
</script>
{% endblock %}
