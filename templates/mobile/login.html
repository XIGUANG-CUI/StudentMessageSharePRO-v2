<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出勤点名</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            padding: 40px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-box .icon {
            text-align: center;
            font-size: 56px;
            margin-bottom: 12px;
        }
        .login-box h1 {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 6px;
        }
        .login-box .subtitle {
            text-align: center;
            font-size: 15px;
            color: #999;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            height: 54px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 17px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            height: 54px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            letter-spacing: 4px;
        }
        .btn-login:active {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .error-msg {
            background: #fff3f3;
            color: #d32f2f;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon">📋</div>
        <h1>出勤点名</h1>
        <p class="subtitle">请使用授权账号登录</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" autocomplete="off">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>
    </div>
</body>
</html>
